.200k: &200k
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 200k

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 200k

.1m: &1m
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m

deepseek-v4-pro: *1m
deepseek-v4-flash: *1m
deepseek-v4-flash-vision-exp: *1m

glm-5.3: *1m
glm-5.3-flash: *1m
glm-5.2: *1m
kimi-k3: *200k
minimax-m3: *200k
minimax-m2.7: *200k

hy3: *200k

main:
  pull_request:
    - stages:
        - name: commitlint
          image: cnbcool/commitlint

  pull_request.mergeable:
    - stages:
        - name: automerge
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true