.1m-high: &1m-high
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m
          thinkingLevel: high

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m
          thinkingLevel: high

.1m-medium: &1m-medium
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m
          thinkingLevel: medium

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m
          thinkingLevel: medium

hy4-preview: *1m-high

deepseek-v4-pro: *1m-medium
deepseek-v4-flash: *1m-medium
# deepseek-v4-flash-vision-exp: *1m-medium

glm-5.3: *1m-medium
glm-5.3-flash: *1m-medium
glm-5.2: *1m-medium
kimi-k3: *1m-medium

main:
  pull_request:
    - stages:
        - name: commitlint
          image: cnbcool/commitlint

  pull_request.mergeable:
    - stages:
        - name: automerge
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true
