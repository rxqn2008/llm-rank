.1m: &1m
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: set model
        script: |
          if [ "$CNB_NPC_NAME" = "hy4-preview" ]; then
            echo "##[set-output NPC_THINKING=high]"
          elif [ "$CNB_NPC_NAME" = "deepseek-v4.1-flash" ]; then
            echo "##[set-output NPC_THINKING=off]"
          else
            echo "##[set-output NPC_THINKING=medium]"
          fi
          if [ "$CNB_NPC_NAME" = "deepseek-v4.1-flash" ] || [ "$CNB_NPC_NAME" = "glm-5.3-flash" ]; then
            echo "##[set-output NPC_SUPPORT_IMAGE=true]"
          else
            echo "##[set-output NPC_SUPPORT_IMAGE=false]"
          fi
        exports:
          NPC_THINKING: NPC_THINKING
          NPC_SUPPORT_IMAGE: NPC_SUPPORT_IMAGE
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m
          thinkingLevel: $NPC_THINKING
          supportImage: $NPC_SUPPORT_IMAGE

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: set model
        script: |
          if [ "$CNB_NPC_NAME" = "hy4-preview" ]; then
            echo "##[set-output NPC_THINKING=high]"
          elif [ "$CNB_NPC_NAME" = "deepseek-v4.1-flash" ]; then
            echo "##[set-output NPC_THINKING=off]"
          else
            echo "##[set-output NPC_THINKING=medium]"
          fi
          if [ "$CNB_NPC_NAME" = "deepseek-v4.1-flash" ] || [ "$CNB_NPC_NAME" = "glm-5.3-flash" ]; then
            echo "##[set-output NPC_SUPPORT_IMAGE=true]"
          else
            echo "##[set-output NPC_SUPPORT_IMAGE=false]"
          fi
        exports:
          NPC_THINKING: NPC_THINKING
          NPC_SUPPORT_IMAGE: NPC_SUPPORT_IMAGE
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m
          thinkingLevel: $NPC_THINKING
          supportImage: $NPC_SUPPORT_IMAGE

hy4-preview: *1m

deepseek-v4.1-flash: *1m
# deepseek-v4-flash-vision-exp: *1m

glm-5.3: *1m
glm-5.3-flash: *1m
glm-5.2: *1m
kimi-k3: *1m

main:
  pull_request:
    - stages:
        - name: commitlint
          image: cnbcool/commitlint

  pull_request.mergeable:
    - stages:
        - name: automerge
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true

  # 大模型热度排行站点：数据更新由 GitHub Actions 负责
  #
  # 更新链路只保留一条（GitHub 为主库）：
  #   GitHub Actions `每日更新大模型热度数据`（.github/workflows/update-data.yml，
  #   每天 00:17 UTC = 北京时间 08:17）拉取数据 → 提交到 main → 触发 Pages 重新发布。
  # 因此这里不再配置 crontab：CNB 与 GitHub 同时写入 llm-rank/data/models.json
  # 会互相覆盖 / 推送冲突。如需改回 CNB 定时更新，请同时删除 GitHub 侧的 schedule，
  # 并参考 llm-rank/.cnb.daily-update.yml 恢复本节点。

# 大模型热度排行站点：在 CNB 上一键起服务预览
# 说明：CNB 不提供静态站点托管（类似 GitHub Pages）能力，原生可行的是
#       通过「云原生开发·仅预览模式」在浏览器中打开站点进行访问与验收。
$:
  vscode:
    - docker:
        image: node:20
      services:
        - docker
        - name: vscode
          options:
            onlyPreview: true
            launch: node llm-rank/scripts/serve.mjs
      stages:
        - name: 站点自检
          script: node llm-rank/scripts/check-site.mjs
