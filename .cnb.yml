.1m: &1m
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: set model
        script: |
          if [ "$CNB_NPC_NAME" = "hy4-preview" ]; then
            echo "##[set-output NPC_THINKING=high]"
          elif [ "$CNB_NPC_NAME" = "deepseek-v4.1-flash" ]; then
            echo "##[set-output NPC_THINKING=off]"
          else
            echo "##[set-output NPC_THINKING=medium]"
          fi
          if [ "$CNB_NPC_NAME" = "deepseek-v4.1-flash" ] || [ "$CNB_NPC_NAME" = "glm-5.3-flash" ]; then
            echo "##[set-output NPC_SUPPORT_IMAGE=true]"
          else
            echo "##[set-output NPC_SUPPORT_IMAGE=false]"
          fi
        exports:
          NPC_THINKING: NPC_THINKING
          NPC_SUPPORT_IMAGE: NPC_SUPPORT_IMAGE
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m
          thinkingLevel: $NPC_THINKING
          supportImage: $NPC_SUPPORT_IMAGE

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
      - name: set model
        script: |
          if [ "$CNB_NPC_NAME" = "hy4-preview" ]; then
            echo "##[set-output NPC_THINKING=high]"
          elif [ "$CNB_NPC_NAME" = "deepseek-v4.1-flash" ]; then
            echo "##[set-output NPC_THINKING=off]"
          else
            echo "##[set-output NPC_THINKING=medium]"
          fi
          if [ "$CNB_NPC_NAME" = "deepseek-v4.1-flash" ] || [ "$CNB_NPC_NAME" = "glm-5.3-flash" ]; then
            echo "##[set-output NPC_SUPPORT_IMAGE=true]"
          else
            echo "##[set-output NPC_SUPPORT_IMAGE=false]"
          fi
        exports:
          NPC_THINKING: NPC_THINKING
          NPC_SUPPORT_IMAGE: NPC_SUPPORT_IMAGE
      - name: run with npc
        type: npc:go
        options:
          model: ${CNB_NPC_NAME}
          contextWindow: 1m
          thinkingLevel: $NPC_THINKING
          supportImage: $NPC_SUPPORT_IMAGE

hy4-preview: *1m

deepseek-v4.1-flash: *1m
# deepseek-v4-flash-vision-exp: *1m

glm-5.3: *1m
glm-5.3-flash: *1m
glm-5.2: *1m
kimi-k3: *1m

main:
  pull_request:
    - stages:
        - name: commitlint
          image: cnbcool/commitlint

  pull_request.mergeable:
    - stages:
        - name: automerge
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true

  # 大模型热度排行站点：每天 08:20 自动刷新热度数据并提交
  "crontab: 20 8 * * *":
    - stages:
        - name: 更新大模型热度数据
          image: node:20
          script: |
            node llm-rank/scripts/update-data.mjs
        - name: 提交数据变更
          image: cnbcool/git:latest
          script: |
            git config user.name "cnb-npc[bot]"
            git config user.email "cnb-npc@noreply.cnb.cool"
            git add llm-rank/data/models.json llm-rank/data/watchlist.json
            if git diff --staged --quiet; then
              echo "数据无变化，跳过提交"
            else
              git commit -m "chore: 更新大模型热度数据 $(date -u +%F)"
              git push origin HEAD:main
            fi

# 大模型热度排行站点：在 CNB 上一键起服务预览
# 说明：CNB 不提供静态站点托管（类似 GitHub Pages）能力，原生可行的是
#       通过「云原生开发·仅预览模式」在浏览器中打开站点进行访问与验收。
$:
  vscode:
    - docker:
        image: node:20
      services:
        - docker
        - name: vscode
          options:
            onlyPreview: true
            launch: node llm-rank/scripts/serve.mjs
      stages:
        - name: 站点自检
          script: node llm-rank/scripts/check-site.mjs
