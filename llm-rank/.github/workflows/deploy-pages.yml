name: 部署大模型热度排行站点到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'llm-rank/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: llm-rank

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
