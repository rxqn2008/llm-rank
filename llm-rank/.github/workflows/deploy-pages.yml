name: 部署大模型热度排行站点到 GitHub Pages

# 触发方式：
#   1) 推送到 main 且改动命中 llm-rank/** 时自动部署
#   2) 在 Actions 页面手动 Run workflow（workflow_dispatch）
on:
  push:
    branches: [main]
    paths:
      - 'llm-rank/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

# GitHub Pages 官方部署要求的最小权限集合
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次 Pages 部署，新的部署取消排队中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages（读取 base path 等元信息）
        id: pages
        uses: actions/configure-pages@v5

      - name: 站点自检（入口文件与数据完整性）
        run: |
          set -e
          test -f llm-rank/index.html || { echo "缺少 llm-rank/index.html"; exit 1; }
          test -f llm-rank/assets/css/style.css || { echo "缺少样式文件"; exit 1; }
          test -f llm-rank/assets/js/app.js || { echo "缺少脚本文件"; exit 1; }
          node -e "const d=require('./llm-rank/data/models.json');if(!Array.isArray(d.models)||!d.models.length){console.error('数据文件为空');process.exit(1)}console.log('数据快照日期:',d.snapshot,'模型数量:',d.models.length)"
          echo "站点自检通过 ✅"

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: llm-rank

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
