name: 部署大模型热度排行站点到 GitHub Pages

# 触发方式：
#   1) 推送到 main 且改动命中 llm-rank/** 时自动部署
#   2) 在 Actions 页面手动 Run workflow（workflow_dispatch）
on:
  push:
    branches: [main]
    paths:
      - 'llm-rank/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

# GitHub Pages 官方部署要求的最小权限集合
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次 Pages 部署，新的部署取消排队中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages（读取 base path 等元信息）
        id: pages
        uses: actions/configure-pages@v5

      - name: 站点自检（入口文件、数据完整性、前端挂载点）
        run: node llm-rank/scripts/check-site.mjs

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: llm-rank

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
