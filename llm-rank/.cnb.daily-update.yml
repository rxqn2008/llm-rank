# 大模型热度数据 · 每日自动更新流水线
#
# 使用方式（二选一）：
#   1）把下面的 main 节点内容合并进仓库根目录 .cnb.yml
#   2）如需单独维护，在 .cnb.yml 中用 !reference / include 引入本文件
#
# 触发：定时触发，每天 08:20（北京时间）自动拉取数据并提交
# 说明：外部数据源不可用时，脚本会回退到离线演算，保证站点每天都有更新

main:
  "crontab: 20 8 * * *":
    - stages:
        - name: 更新大模型热度数据
          image: node:20
          script: |
            node llm-rank/scripts/update-data.mjs
        - name: 提交数据变更
          image: cnbcool/git:latest
          script: |
            git config user.name "cnb-npc[bot]"
            git config user.email "cnb-npc@noreply.cnb.cool"
            git add llm-rank/data/models.json llm-rank/data/watchlist.json
            if git diff --staged --quiet; then
              echo "数据无变化，跳过提交"
            else
              git commit -m "chore: 更新大模型热度数据 $(date -u +%F)"
              git push origin HEAD:main
            fi
