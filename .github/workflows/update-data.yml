name: 每日更新大模型热度数据

# 本仓库的**唯一**更新链路：定时拉取数据 → 提交 main → 触发 Pages 重新发布。
# CNB 侧（根 .cnb.yml）已移除同类 crontab，避免两处同时写 llm-rank/data/models.json。
on:
  schedule:
    # 每天 00:17 UTC（北京时间 08:17）更新一次
    - cron: '17 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 拉取最新数据并生成快照
        run: node llm-rank/scripts/update-data.mjs
        env:
          # 可选：替换为自定义数据源 API，未设置时使用 OpenRouter 公开模型数据
          LLM_RANK_SOURCE: ${{ secrets.LLM_RANK_SOURCE }}

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llm-rank/data/models.json llm-rank/data/watchlist.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新大模型热度数据 $(date -u +%F)"
            # 数据更新链路以 GitHub 为主库，但 main 仍可能被仓库其他改动（含 CNB 侧推送）改写，
            # 推送前先 rebase 再接上，避免 non-fast-forward 直接失败
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
